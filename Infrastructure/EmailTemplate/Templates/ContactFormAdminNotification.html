<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; }
        .header { background-color: #2e7d32; color: white; padding: 15px; border-radius: 6px 6px 0 0; }
        .content { padding: 20px 0; }
        .field { margin-bottom: 12px; }
        .label { font-weight: bold; color: #555; }
        .message-box { background-color: #f9f9f9; padding: 15px; border-left: 4px solid #2e7d32; margin-top: 8px; white-space: pre-wrap; }
        .footer { font-size: 0.85em; color: #888; margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 style="margin:0;">Ny henvendelse fra kontaktskjema</h2>
    </div>
    <div class="content">
        <div class="field"><span class="label">Navn:</span> {{ name }}</div>
        <div class="field"><span class="label">E-post:</span> <a href="mailto:{{ email }}">{{ email }}</a></div>
        <div class="field"><span class="label">Emne:</span> {{ subject }}</div>
        <div class="field"><span class="label">Mottatt:</span> {{ submitted_at }}</div>
        <div class="field">
            <span class="label">Melding:</span>
            <div class="message-box">{{ message }}</div>
        </div>
    </div>
    <div class="footer">
        Denne e-posten ble automatisk generert fra kontaktskjemaet på Kjøkkenhylla.
    </div>
</div>
</body>
</html>
