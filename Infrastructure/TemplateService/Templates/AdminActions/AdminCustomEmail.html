{{ title = subject }}
{{ capture content }}

                        <h1 style="margin: 0 0 20px 0; font-size: 20px; font-weight: 700; color: #222920; line-height: 1.3;">
                            {{ subject }}
                        </h1>

                        <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.6; color: #222920;">
                            Hei {{ name }},
                        </p>

                        <!-- Meldingstekst med bevart linjeskift -->
                        <div style="font-size: 15px; line-height: 1.6; color: #222920; white-space: pre-wrap; margin-bottom: 24px;">
                            {{ message }}
                        </div>
{{ end }}
{{ include "_Layout" }}
