<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; }
        .header { background-color: #2e7d32; color: white; padding: 20px; border-radius: 6px 6px 0 0; text-align: center; }
        .content { padding: 20px; }
        .message-body { font-size: 1em; color: #333; white-space: pre-wrap; margin: 15px 0; }
        .footer { font-size: 0.85em; color: #888; margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size: 22px;">{{ subject }}</h1>
    </div>
    <div class="content">
        <p>Hei {{ name }},</p>

        <div class="message-body">{{ message }}</div>
    </div>
    <div class="footer">
        Med vennlig hilsen,<br>
        <strong>Kjøkkenhylla-teamet</strong>
    </div>
</div>
</body>
</html>
