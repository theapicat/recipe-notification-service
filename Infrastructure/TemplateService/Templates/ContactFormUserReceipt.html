<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; }
        .header { background-color: #2e7d32; color: white; padding: 15px; border-radius: 6px 6px 0 0; }
        .content { padding: 20px 0; }
        .message-copy { background-color: #f9f9f9; padding: 15px; border-left: 4px solid #ccc; margin-top: 10px; white-space: pre-wrap; font-size: 0.9em; }
        .footer { font-size: 0.85em; color: #888; margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 style="margin:0;">Takk for din henvendelse!</h2>
    </div>
    <div class="content">
        <p>Hei {{ name }},</p>
        <p>Vi har mottatt meldingen din angående <strong>"{{ subject }}"</strong> og behandler den så raskt som mulig.</p>
        <p>Her er en kopi av meldingen du sendte til oss:</p>
        <div class="message-copy">{{ message }}</div>
    </div>
    <div class="footer">
        Med vennlig hilsen,<br>
        <strong>Kjøkkenhylla-teamet</strong>
    </div>
</div>
</body>
</html>
