<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Ny henvendelse fra kontaktskjema</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f7f6f2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #222920;">

<!-- Ytre container -->
<table border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color: #f7f6f2; padding: 40px 10px;"
       width="100%">
    <tr>
        <td align="center">

            <!-- Hovedkort -->
            <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="max-width: 560px; background-color: #ffffff; border: 1px solid #e2e5df; border-radius: 12px; overflow: hidden; border-collapse: separate;"
                   width="100%">

                <!-- Header Banner -->
                <tr>
                    <td style="background-color: #2a3e30; padding: 24px; text-align: center;">
                        <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation">
                            <tr>
                                <!-- Kokkelue Logo (Inline SVG) -->
                                <td style="padding-right: 10px; vertical-align: middle;">
                                    <svg fill="none" height="28" viewBox="0 0 32 32" width="28"
                                         xmlns="http://www.w3.org/2000/svg">
                                        <rect fill="#5E8C71" height="32" rx="8" width="32"/>
                                        <path d="M11 19.5C8.8 19.5 7.8 15.5 10 13.8C9.8 11 13.8 9.8 16 11.2C18.2 9.8 22.2 11 22 13.8C24.2 15.5 23.2 19.5 21 19.5H11Z"
                                              fill="white"/>
                                        <rect fill="white" height="3" rx="1" width="10" x="11" y="20.5"/>
                                    </svg>
                                </td>
                                <td style="vertical-align: middle;">
                                    <span style="color: #ffffff; font-size: 20px; font-weight: 700; letter-spacing: -0.3px;">Kjøkkenhylla</span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Innholdsområde -->
                <tr>
                    <td style="padding: 32px 28px; color: #222920;">

                        <h1 style="margin: 0 0 20px 0; font-size: 22px; font-weight: 700; color: #222920; line-height: 1.3;">
                            Ny henvendelse fra kontaktskjema
                        </h1>

                        <!-- Detaljoversikt -->
                        <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin-bottom: 20px; font-size: 15px; line-height: 1.6;"
                               width="100%">
                            <tr>
                                <td style="padding: 4px 0; color: #596356; width: 80px; vertical-align: top; font-weight: 600;">
                                    Navn:
                                </td>
                                <td style="padding: 4px 0; color: #222920; vertical-align: top;">{{ name }}</td>
                            </tr>
                            <tr>
                                <td style="padding: 4px 0; color: #596356; vertical-align: top; font-weight: 600;">
                                    E-post:
                                </td>
                                <td style="padding: 4px 0; color: #222920; vertical-align: top;">
                                    <a href="mailto:{{ email }}"
                                       style="color: #4a6b53; text-decoration: underline; font-weight: 600;">{{ email
                                        }}</a>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding: 4px 0; color: #596356; vertical-align: top; font-weight: 600;">
                                    Emne:
                                </td>
                                <td style="padding: 4px 0; color: #222920; vertical-align: top;">{{ subject }}</td>
                            </tr>
                            <tr>
                                <td style="padding: 4px 0; color: #596356; vertical-align: top; font-weight: 600;">
                                    Mottatt:
                                </td>
                                <td style="padding: 4px 0; color: #222920; vertical-align: top;">{{ submitted_at }}</td>
                            </tr>
                        </table>

                        <p style="margin: 16px 0 8px 0; font-size: 15px; font-weight: 600; color: #2a3e30;">
                            Melding:
                        </p>

                        <!-- Melding Boks -->
                        <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin-bottom: 8px;"
                               width="100%">
                            <tr>
                                <td style="background-color: #f2f6f3; border-left: 4px solid #4a6b53; padding: 14px 16px; border-radius: 4px; color: #222920; font-size: 14px; line-height: 1.6; white-space: pre-wrap;">
                                    {{ message }}
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>

                <!-- Skillelinje -->
                <tr>
                    <td style="padding: 0 28px;">
                        <hr style="border: none; border-top: 1px solid #e2e5df; margin: 0;">
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding: 24px 28px; text-align: center; color: #596356; font-size: 13px; line-height: 1.5;">
                        <p style="margin: 0;">
                            Denne e-posten ble automatisk generert fra kontaktskjemaet på Kjøkkenhylla.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
