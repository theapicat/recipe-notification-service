{{ title = "Takk for din henvendelse!" }}
{{ capture content }}

                        <h1 style="margin: 0 0 20px 0; font-size: 22px; font-weight: 700; color: #222920; line-height: 1.3;">
                            Takk for din henvendelse!
                        </h1>

                        <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.6; color: #222920;">
                            Hei {{ name }},
                        </p>

                        <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.6; color: #222920;">
                            Vi har mottatt meldingen din angående <strong>«{{ subject }}»</strong> og behandler den så
                            raskt som mulig.
                        </p>

                        <p style="margin: 0 0 12px 0; font-size: 15px; line-height: 1.6; color: #222920;">
                            Her er en kopi av meldingen du sendte til oss:
                        </p>

                        <!-- Melding Kopi Boks -->
                        <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin-bottom: 24px;"
                               width="100%">
                            <tr>
                                <td style="background-color: #f2f6f3; border-left: 4px solid #4a6b53; padding: 14px 16px; border-radius: 4px; color: #222920; font-size: 14px; line-height: 1.6; white-space: pre-wrap;">
                                    {{ message }}
                                </td>
                            </tr>
                        </table>
{{ end }}
{{ include "_Layout" }}
